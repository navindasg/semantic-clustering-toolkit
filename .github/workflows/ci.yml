name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pytest --cov=toolkit --cov-report=term

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: toolkit
          POSTGRES_PASSWORD: toolkit
          POSTGRES_DB: toolkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toolkit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TOOLKIT_TEST_POSTGRES_URL: postgresql://toolkit:toolkit@localhost:5432/toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest tests/test_store.py tests/test_parity_models.py -v
